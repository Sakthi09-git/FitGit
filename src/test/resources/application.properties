# ==============================================================================
# FitLog - Test Configuration (H2 in MySQL mode for reliable testing)
# ==============================================================================

spring.datasource.url=jdbc:h2:mem:fitlog_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Swagger for tests to speed up startup
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
