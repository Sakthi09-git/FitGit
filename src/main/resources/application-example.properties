# ==============================================================================
# FitLog - Example Application Configuration
# Copy this file to application.properties and customize with your credentials
# ==============================================================================

# Server Configuration
server.port=8080

# Application Name
spring.application.name=FitLog

# Database Configuration (Replace with your MySQL credentials)
# Example URL with auto-creation of database 'fitlog_db'
spring.datasource.url=jdbc:mysql://localhost:3306/fitlog_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_MYSQL_USERNAME_HERE
spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# 'update' automatically updates the schema to match Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Swagger / OpenAPI UI
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# Logging Configuration
logging.level.com.fitlog=DEBUG
logging.level.org.springframework.web=INFO
